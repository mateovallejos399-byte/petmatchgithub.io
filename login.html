<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — PetMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(250, 250, 250, 0.92), rgba(250, 250, 250, 0.96)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .dark .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(9, 9, 11, 0.90), rgba(9, 9, 11, 0.95)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
        }
    </style>
</head>
<body class="bg-hero-pattern text-zinc-800 dark:text-zinc-100 antialiased min-h-screen flex flex-col justify-between selection:bg-rose-100 selection:text-rose-700">

    <!-- HEADER SIMPLIFICADO -->
    <header class="max-w-7xl mx-auto px-6 h-20 w-full flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center shadow-md">
                <i data-lucide="paw-print" class="w-5 h-5"></i>
            </div>
            <span class="font-bold text-xl tracking-tight text-zinc-900 dark:text-white">PetMatch</span>
        </a>
        <a href="index.html" class="text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al inicio
        </a>
    </header>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <main class="max-w-md mx-auto px-6 w-full py-12">
        <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md p-8 rounded-3xl border border-zinc-200/80 dark:border-zinc-800 shadow-xl">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-zinc-900 dark:text-white mb-2">Bienvenido de nuevo</h1>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">Ingresá a tu cuenta para gestionar tus turnos y mascotas.</p>
            </div>

            <!-- Cambiamos el form por un div con id para evitar problemas de envío automático -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wider mb-2">Correo electrónico</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-5 h-5 text-zinc-400 absolute left-3.5 top-3"></i>
                        <input type="text" id="email" placeholder="tucorreo@email.com o 1234" class="w-full bg-zinc-50 dark:bg-zinc-950/50 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 pl-11 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-rose-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-5 h-5 text-zinc-400 absolute left-3.5 top-3"></i>
                        <input type="password" id="password" placeholder="••••••••" class="w-full bg-zinc-50 dark:bg-zinc-950/50 border border-zinc-200 dark:border-zinc-800 rounded-xl px-4 py-2.5 pl-11 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-rose-500 transition-colors">
                    </div>
                </div>

                <!-- Botón directo con función onclick -->
                <button type="button" onclick="handleLogin()" class="w-full mt-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-medium py-3 rounded-xl hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all shadow-sm text-sm cursor-pointer">
                    Iniciar Sesión
                </button>
            </div>

            <div class="mt-6 text-center text-sm text-zinc-500 dark:text-zinc-400">
                ¿No tenés una cuenta? <a href="register.html" class="text-rose-600 dark:text-rose-400 font-semibold hover:underline">Registrate gratis</a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center text-xs text-zinc-400">
        <p>&copy; 2026 PetMatch. Todos los derechos reservados.</p>
    </footer>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();
        
        // Mantener preferencia de modo oscuro si ya estaba aplicada
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Configuración de Supabase
        const SUPABASE_URL = 'TU_PROJECT_URL_AQUI';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Función directa para el botón de login
        async function handleLogin() {
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');

            const email = emailField.value.trim();
            const password = passwordField.value.trim();

            // BYPASS DIRECTO: Si pones 1234 y 1234
            if (email === '1234' && password === '1234') {
                alert('¡Acceso rápido concedido (Bypass 1234)!');
                // CAMBIA ESTO por el nombre exacto de tu archivo de la estación central (ej: dashboard.html)
                window.location.href = 'principal.html'; 
                return;
            }

            // Validación normal con Supabase
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Error al iniciar sesión: ' + error.message);
            } else {
                alert('¡Inicio de sesión exitoso! Redirigiendo al panel...');
                window.location.href = 'principal.html';
            }
        }
    </script>
</body>
</html>

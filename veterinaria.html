<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria — PetMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(250, 250, 250, 0.92), rgba(250, 250, 250, 0.96)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .dark .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(9, 9, 11, 0.90), rgba(9, 9, 11, 0.95)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
        }
    </style>
</head>
<body class="bg-hero-pattern text-zinc-800 dark:text-zinc-100 antialiased min-h-screen flex flex-col justify-between selection:bg-rose-100 selection:text-rose-700">

    <div>
        <!-- HEADER INDEPENDIENTE -->
        <header class="max-w-7xl mx-auto px-6 h-20 w-full flex items-center justify-between border-b border-zinc-200/60 dark:border-zinc-800/60 backdrop-blur-md bg-white/50 dark:bg-zinc-950/50 sticky top-0 z-40">
            <a href="dashboard.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center shadow-md">
                    <i data-lucide="paw-print" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-zinc-900 dark:text-white">PetMatch</span>
            </a>

            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors flex items-center gap-2 bg-white/80 dark:bg-zinc-900/80 px-4 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al panel
                </a>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL DE VETERINARIA -->
        <main class="max-w-4xl mx-auto px-6 pt-10 pb-20">
            
            <div class="flex items-center gap-4 mb-8">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center shadow-md">
                    <i data-lucide="stethoscope" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">Servicio de Veterinaria</h1>
                    <p class="text-sm text-zinc-500 dark:text-zinc-400">Turnos programados, historiales y atención ante urgencias médicas.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <!-- Columna Izquierda: Formulario para sacar turno -->
                <div class="md:col-span-1 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md p-6 rounded-3xl border border-zinc-200/80 dark:border-zinc-800 shadow-xl h-fit">
                    <h2 class="font-bold text-base text-zinc-900 dark:text-white mb-4 flex items-center gap-2">
                        <i data-lucide="calendar-plus" class="w-4 h-4 text-blue-600"></i> Agendar Cita
                    </h2>

                    <form id="appointmentForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wider mb-2">Mascota</label>
                            <select id="appointmentPetSelect" required class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-blue-500">
                                <option value="">Cargando mascotas...</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wider mb-2">Fecha</label>
                            <input type="date" id="appointmentDate" required class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-zinc-600 dark:text-zinc-400 uppercase tracking-wider mb-2">Tipo de Atención</label>
                            <select id="appointmentType" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-blue-500">
                                <option value="Consulta general">Consulta general</option>
                                <option value="Vacunación">Vacunación</option>
                                <option value="Urgencia">Urgencia médica</option>
                                <option value="Control periódico">Control periódico</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-all shadow-sm text-sm">
                            Confirmar Turno
                        </button>
                    </form>
                </div>

                <!-- Columna Derecha: Listado de Turnos Activos -->
                <div class="md:col-span-2 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-zinc-200/80 dark:border-zinc-800 shadow-xl">
                    <h2 class="font-bold text-lg text-zinc-900 dark:text-white mb-4 flex items-center gap-2">
                        <i data-lucide="calendar-check" class="w-5 h-5 text-blue-600"></i> Tus Turnos Reservados
                    </h2>

                    <div id="appointmentsList" class="space-y-3">
                        <div class="p-6 rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-700 text-center text-zinc-400 text-sm">
                            No hay turnos médicos agendados todavía.
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="py-8 text-center text-sm text-zinc-500 dark:text-zinc-400 backdrop-blur-md bg-white/30 dark:bg-zinc-950/30 border-t border-zinc-200/60 dark:border-zinc-800/60">
        <p>&copy; 2026 PetMatch. Todos los derechos reservados.</p>
    </footer>

    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        lucide.createIcons();
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        const SUPABASE_URL = 'TU_PROJECT_URL_AQUI';
        const SUPABASE_ANON_KEY = 'TU_ANON_KEY_AQUI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSessionAndLoadData() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            loadPetsDropdown(session.user.id);
            loadAppointments(session.user.id);
        }

        async function loadPetsDropdown(userId) {
            const { data: pets } = await _supabase
                .from('pets')
                .select('*')
                .eq('user_id', userId);

            const selectPet = document.getElementById('appointmentPetSelect');
            if (pets && pets.length > 0) {
                selectPet.innerHTML = pets.map(pet => `<option value="${pet.id}">${pet.nombre} (${pet.species || pet.especie})</option>`).join('');
            } else {
                selectPet.innerHTML = `<option value="">Registra una mascota primero</option>`;
            }
        }

        async function loadAppointments(userId) {
            const { data: appointments } = await _supabase
                .from('appointments')
                .select('*, pets(nombre)')
                .eq('user_id', userId)
                .order('fecha', { ascending: true });

            const listContainer = document.getElementById('appointmentsList');
            if (appointments && appointments.length > 0) {
                listContainer.innerHTML = appointments.map(app => `
                    <div class="flex items-center justify-between p-4 rounded-2xl bg-zinc-50 dark:bg-zinc-950/50 border border-zinc-200 dark:border-zinc-800 text-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold">
                                🩺
                            </div>
                            <div>
                                <h4 class="font-bold text-zinc-900 dark:text-white">${app.pets?.nombre || 'Mascota'}</h4>
                                <p class="text-xs text-zinc-500 dark:text-zinc-400">${app.tipo} • Fecha: ${app.fecha}</p>
                            </div>
                        </div>
                        <span class="px-3 py-1 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 font-semibold rounded-full text-xs">Confirmado</span>
                    </div>
                `).join('');
            } else {
                listContainer.innerHTML = `
                    <div class="p-6 rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-700 text-center text-zinc-400 text-sm">
                        No hay turnos médicos agendados todavía.
                    </div>
                `;
            }
        }

        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { session } } = await _supabase.auth.getSession();
            
            const pet_id = document.getElementById('appointmentPetSelect').value;
            const fecha = document.getElementById('appointmentDate').value;
            const tipo = document.getElementById('appointmentType').value;

            if (!pet_id) {
                alert('Por favor selecciona una mascota válida.');
                return;
            }

            const { error } = await _supabase.from('appointments').insert([
                { user_id: session.user.id, pet_id, fecha, tipo }
            ]);

            if (error) {
                alert('Error al reservar el turno: ' + error.message);
            } else {
                document.getElementById('appointmentForm').reset();
                loadAppointments(session.user.id);
            }
        });

        checkSessionAndLoadData();
    </script>
</body>
</html>

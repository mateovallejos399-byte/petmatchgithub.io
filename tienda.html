<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda & Adopción — PetMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(250, 250, 250, 0.92), rgba(250, 250, 250, 0.96)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .dark .bg-hero-pattern {
            background-image: linear-gradient(to bottom, rgba(9, 9, 11, 0.90), rgba(9, 9, 11, 0.95)), 
                              url('https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=1920&auto=format&fit=crop');
        }
    </style>
</head>
<body class="bg-hero-pattern text-zinc-800 dark:text-zinc-100 antialiased min-h-screen flex flex-col justify-between selection:bg-amber-100 selection:text-amber-700">

    <div>
        <!-- HEADER INDEPENDIENTE -->
        <header class="max-w-7xl mx-auto px-6 h-20 w-full flex items-center justify-between border-b border-zinc-200/60 dark:border-zinc-800/60 backdrop-blur-md bg-white/50 dark:bg-zinc-950/50 sticky top-0 z-40">
            <a href="dashboard.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center shadow-md">
                    <i data-lucide="paw-print" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-zinc-900 dark:text-white">PetMatch</span>
            </a>

            <div class="flex items-center gap-4">
                <button onclick="toggleCartModal()" class="relative flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-md">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Carrito
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <a href="dashboard.html" class="text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors flex items-center gap-2 bg-white/80 dark:bg-zinc-900/80 px-4 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
                </a>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL DE LA TIENDA -->
        <main class="max-w-6xl mx-auto px-6 pt-10 pb-20">
            
            <div class="flex items-center gap-4 mb-8">
                <div class="w-14 h-14 rounded-2xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center shadow-md">
                    <i data-lucide="store" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white">Tienda Oficial & Adopción</h1>
                    <p class="text-sm text-zinc-500 dark:text-zinc-400">Seleccioná un apartado para explorar alimentos, juguetes o cachorros y refugios.</p>
                </div>
            </div>

            <!-- BOTONES DE APARTADOS / CATEGORÍAS (TABS) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
                <button onclick="switchTab('alimentos')" id="btn-alimentos" class="tab-btn flex items-center gap-4 p-5 rounded-3xl border border-amber-500 bg-amber-50/50 dark:bg-amber-950/20 text-zinc-900 dark:text-white transition-all shadow-lg text-left group">
                    <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-md shrink-0">
                        <i data-lucide="bone" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base">Alimentos</h3>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">Royal Canin, Eukanuba, Pedigree y más</p>
                    </div>
                </button>

                <button onclick="switchTab('juguetes')" id="btn-juguetes" class="tab-btn flex items-center gap-4 p-5 rounded-3xl border border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-900/80 text-zinc-600 dark:text-zinc-400 hover:border-amber-400 transition-all shadow-sm text-left group">
                    <div class="w-12 h-12 rounded-2xl bg-zinc-100 dark:bg-zinc-800 text-amber-600 flex items-center justify-center shadow-sm shrink-0 group-hover:bg-amber-500 group-hover:text-white transition-colors">
                        <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-zinc-900 dark:text-white">Juguetes & Accesorios</h3>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">Kongs, pelotas interactivas y más</p>
                    </div>
                </button>

                <button onclick="switchTab('cachorros')" id="btn-cachorros" class="tab-btn flex items-center gap-4 p-5 rounded-3xl border border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-900/80 text-zinc-600 dark:text-zinc-400 hover:border-amber-400 transition-all shadow-sm text-left group">
                    <div class="w-12 h-12 rounded-2xl bg-zinc-100 dark:bg-zinc-800 text-amber-600 flex items-center justify-center shadow-sm shrink-0 group-hover:bg-amber-500 group-hover:text-white transition-colors">
                        <i data-lucide="heart" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-zinc-900 dark:text-white">Cachorros & Refugios</h3>
                        <p class="text-xs text-zinc-500 dark:text-zinc-400">Razas certificadas y adopción cercana</p>
                    </div>
                </button>
            </div>

            <!-- CONTENEDOR DINÁMICO DEL APARTADO SELECCIONADO -->
            <div id="sectionContainer">
                <!-- Se inyecta según la pestaña activa -->
            </div>

        </main>
    </div>

    <!-- MODAL DEL CARRITO -->
    <div id="cartModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-4 border-b border-zinc-200 dark:border-zinc-800">
                <h3 class="font-bold text-lg text-zinc-900 dark:text-white flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-500"></i> Tu Carrito / Reservas
                </h3>
                <button onclick="toggleCartModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="cartItemsList" class="py-4 space-y-3 overflow-y-auto flex-1 divide-y divide-zinc-100 dark:divide-zinc-800/50">
                <p class="text-center text-sm text-zinc-400 py-8">Tu carrito está vacío.</p>
            </div>

            <div class="pt-4 border-t border-zinc-200 dark:border-zinc-800">
                <div class="flex items-center justify-between mb-4">
                    <span class="font-medium text-sm text-zinc-500 dark:text-zinc-400">Total a pagar:</span>
                    <span id="cartTotalPrice" class="font-bold text-xl text-zinc-900 dark:text-white">$0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl transition-all shadow-md text-sm">
                    Confirmar Pedido / Pago
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-8 text-center text-sm text-zinc-500 dark:text-zinc-400 backdrop-blur-md bg-white/30 dark:bg-zinc-950/30 border-t border-zinc-200/60 dark:border-zinc-800/60">
        <p>&copy; 2026 PetMatch. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica de Pestañas y Carrito -->
    <script>
        lucide.createIcons();
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Base de datos de productos dividida por apartados
        const storeData = {
            alimentos: [
                { id: 1, name: "Royal Canin Medium Adult 15kg", price: 68500, image: "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?q=80&w=600&auto=format&fit=crop", badge: "Más Vendido", desc: "Alimento balanceado completo para perros adultos de razas medianas." },
                { id: 2, name: "Eukanuba Adulto Razas Medianas 15kg", price: 61200, image: "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?q=80&w=600&auto=format&fit=crop", badge: "Envío Gratis", desc: "Nutrición 100% completa y equilibrada para vitalidad óptima." },
                { id: 3, name: "Pedigree Adulto Carne y Vegetales 21kg", price: 44900, image: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=600&auto=format&fit=crop", badge: "Descuento 15%", desc: "Desarrollado con nutricionistas de Waltham para defensas fuertes." },
                { id: 4, name: "Dog Chow Adultos Medianos y Grandes 21kg", price: 42500, image: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?q=80&w=600&auto=format&fit=crop", badge: "Popular", desc: "Con ExtraLife, mezcla especial de antioxidantes, vitaminas y minerales." }
            ],
            juguetes: [
                { id: 5, name: "Juguete Kong Classic Original (Perros)", price: 24500, image: "https://images.unsplash.com/photo-1535930891776-0c2dfb7fda1a?q=80&w=600&auto=format&fit=crop", badge: "Anti-estrés", desc: "Goma ultra resistente para rellenar con premios o snacks." },
                { id: 6, name: "Pelota Interactiva Dispensadora de Premios", price: 15800, image: "https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=600&auto=format&fit=crop", badge: "Novedad", desc: "Estimula la inteligencia de tu mascota mientras come jugando." }
            ],
            cachorros: [
                { id: 7, name: "Cachorro Golden Retriever (Criadero Certificado)", price: 350000, image: "https://images.unsplash.com/photo-1633722715463-d30f4f325e24?q=80&w=600&auto=format&fit=crop", badge: "Vacunado", desc: "Disponible con libreta sanitaria al día, padres a la vista." },
                { id: 8, name: "Cachorro Ovejero Alemán Línea de Trabajo", price: 320000, image: "https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?q=80&w=600&auto=format&fit=crop", badge: "Pedigree", desc: "Excelente temperamento, listos para entregar a partir de los 60 días." },
                { id: 9, name: "Adopción Responsable: Refugio Patitas Neuquén", price: 5000, image: "https://images.unsplash.com/photo-1548199973-03cce0bbc87b?q=80&w=600&auto=format&fit=crop", badge: "Adopción", desc: "Costo administrativo y castración obligatoria para rescatados." }
            ]
        };

        let cart = [];
        let currentTab = 'alimentos';

        function switchTab(tabName) {
            currentTab = tabName;
            
            // Actualizar diseño visual de los botones de pestañas
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn flex items-center gap-4 p-5 rounded-3xl border border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-900/80 text-zinc-600 dark:text-zinc-400 hover:border-amber-400 transition-all shadow-sm text-left group";
                const iconDiv = btn.querySelector('div');
                iconDiv.className = "w-12 h-12 rounded-2xl bg-zinc-100 dark:bg-zinc-800 text-amber-600 flex items-center justify-center shadow-sm shrink-0 group-hover:bg-amber-500 group-hover:text-white transition-colors";
            });

            const activeBtn = document.getElementById(`btn-${tabName}`);
            activeBtn.className = "tab-btn flex items-center gap-4 p-5 rounded-3xl border border-amber-500 bg-amber-50/50 dark:bg-amber-950/20 text-zinc-900 dark:text-white transition-all shadow-lg text-left group";
            activeBtn.querySelector('div').className = "w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-md shrink-0";

            renderSectionContent(tabName);
        }

        function renderSectionContent(tabName) {
            const container = document.getElementById('sectionContainer');
            const items = storeData[tabName];

            let titleHTML = '';
            if(tabName === 'alimentos') {
                titleHTML = `<h2 class="text-xl font-bold text-zinc-900 dark:text-white mb-6 flex items-center gap-2"><i data-lucide="bone" class="w-5 h-5 text-amber-500"></i> Alimentos Balanceados Destacados en Argentina</h2>`;
            } else if(tabName === 'juguetes') {
                titleHTML = `<h2 class="text-xl font-bold text-zinc-900 dark:text-white mb-6 flex items-center gap-2"><i data-lucide="gamepad-2" class="w-5 h-5 text-amber-500"></i> Juguetes Interactivos y Accesorios</h2>`;
            } else {
                titleHTML = `<h2 class="text-xl font-bold text-zinc-900 dark:text-white mb-6 flex items-center gap-2"><i data-lucide="heart" class="w-5 h-5 text-amber-500"></i> Cachorros de Raza y Refugios Cercanos</h2>`;
            }

            container.innerHTML = `
                ${titleHTML}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${items.map(product => `
                        <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md rounded-3xl border border-zinc-200/80 dark:border-zinc-800 shadow-xl overflow-hidden flex flex-col justify-between group transition-all hover:shadow-2xl">
                            <div>
                                <div class="relative h-48 overflow-hidden bg-zinc-100 dark:bg-zinc-950">
                                    <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <span class="absolute top-3 left-3 bg-zinc-900/80 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full shadow-md">
                                        ${product.badge}
                                    </span>
                                </div>
                                <div class="p-5">
                                    <h3 class="font-bold text-zinc-900 dark:text-white text-base mb-1 line-clamp-1">${product.name}</h3>
                                    <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-3 line-clamp-2">${product.desc}</p>                                     <span class="text-2xl font-black text-amber-600 dark:text-amber-400">$${product.price.toLocaleString('es-AR')}</span>
                                </div>
                            </div>
                            <div class="p-5 pt-0">
                                <button onclick="addToCart(${product.id})" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 rounded-xl transition-all shadow-sm text-sm flex items-center justify-center gap-2">
                                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Añadir al carrito
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function addToCart(productId) {
            // Buscar en todas las categorías
            let product = null;
            for (let cat in storeData) {
                const found = storeData[cat].find(p => p.id === productId);
                if (found) { product = found; break; }
            }

            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cartBadge');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.innerText = totalCount;

            const listContainer = document.getElementById('cartItemsList');
            if (cart.length > 0) {
                listContainer.innerHTML = cart.map(item => `
                    <div class="py-3 flex items-center justify-between text-sm">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 rounded-xl object-cover">
                            <div>
                                <h4 class="font-bold text-zinc-900 dark:text-white line-clamp-1">${item.name}</h4>
                                <p class="text-xs text-zinc-500">$${item.price.toLocaleString('es-AR')} x ${item.quantity}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-rose-500 hover:text-rose-700 p-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
            } else {
                listContainer.innerHTML = `<p class="text-center text-sm text-zinc-400 py-8">Tu carrito está vacío.</p>`;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cartTotalPrice').innerText = `$${totalPrice.toLocaleString('es-AR')}`;
            lucide.createIcons();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('El carrito está vacío.');
                return;
            }
            alert('¡Pedido procesado con éxito! Redirigiendo a pasarela de pagos simulada...');
            cart = [];
            updateCartUI();
            toggleCartModal();
        }

        // Cargar vista inicial por defecto
        switchTab('alimentos');
    </script>
</body>
</html>
